[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openremaster-framework"
version = "0.1.0.dev0"
description = "Evidence-first sidecar framework for game remaster and reverse-engineering projects"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
