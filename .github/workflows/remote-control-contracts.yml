name: Remote Control M001 Synthetic Contracts
on:
  pull_request:
    branches: [main, fix/m001-rfc3339-validator-20261013]
    paths:
      - "contracts/remote-control/**"
      - "src/openremaster/remote_control.py"
      - "tests/test_remote_control_contracts.py"
      - "tests/fixtures/remote-control/**"
      - ".github/workflows/remote-control-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-control-m001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest==8.3.5 jsonschema==4.23.0 rfc3339-validator==0.1.4
      - name: Synthetic contracts only
        run: python -m pytest -q tests/test_remote_control_contracts.py
