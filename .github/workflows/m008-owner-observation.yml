name: ORCH M008 Owner Observation Dual Signature — Synthetic
on:
  pull_request:
    branches: [m007/source-freshness-guard-v1-20261014]
    paths:
      - 'src/openremaster/owner_observation_attestation_v1.py'
      - 'tests/test_owner_observation_attestation_v1.py'
      - 'docs/contracts/orch-m008-owner-observation-attestation-v1.md'
      - '.github/workflows/m008-owner-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orf-m008-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-verify-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5 jsonschema==4.23.0 rfc3339-validator==0.1.4 cryptography==46.0.4
      - name: Run only pure M001-M008 synthetic contract tests
        run: PYTHONPATH=src python -m pytest -q tests/test_remote_control_contracts.py tests/test_m002_structural.py tests/test_m003_cas_lab.py tests/test_m004_witness_lab.py tests/test_m005_anchor_contract.py tests/test_m006_r14_m005_gap.py tests/test_source_freshness_guard_v1.py tests/test_owner_observation_attestation_v1.py
