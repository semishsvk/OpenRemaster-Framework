name: SourceFreshnessGuard v1 — read-only source classification

on:
  pull_request:
    branches: [m006/r14-m005-contract-gap-20261014]
    paths:
      - 'src/openremaster/source_freshness_guard_v1.py'
      - 'tests/test_source_freshness_guard_v1.py'
      - 'docs/contracts/source-freshness-guard-v1.md'
      - '.github/workflows/source-freshness-guard-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-freshness-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-classification-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5
      - name: Synthetic hash-only fail-closed fixtures; no HomePC or owner service
        run: PYTHONPATH=src python -m pytest -q tests/test_source_freshness_guard_v1.py
