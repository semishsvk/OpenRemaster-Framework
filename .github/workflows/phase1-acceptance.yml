name: Phase 1 Acceptance
on:
  push:
    branches: [framework/phase1-bootstrap]
  pull_request:
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python scripts/phase1_acceptance.py
