name: Framework Acceptance Canary
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "portfolio/**"
      - "pyproject.toml"
      - ".github/workflows/phase1-acceptance.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "portfolio/**"
      - "pyproject.toml"
      - ".github/workflows/phase1-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest jsonschema==4.23.0
      - name: Validate portfolio registry
        run: python scripts/validate_portfolio.py
      - name: Phase 1 acceptance
        run: python scripts/phase1_acceptance.py
