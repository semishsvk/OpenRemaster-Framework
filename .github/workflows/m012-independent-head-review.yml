name: M012 Two Signed Head Claims Synthetic
on:
  pull_request:
    branches: [m011/signed-remote-recovery-lab-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5 jsonschema==4.23.0 rfc3339-validator==0.1.4 cryptography==46.0.4
      - name: Run offline synthetic M012 negative tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_m012_independent_head_review.py
