name: Consolidated development source checks
on:
  pull_request:
    branches: [main]
    paths: ['development/**', 'scripts/development_acceptance.py', 'tests/test_m010_durable_recovery.py', '.github/workflows/development-consolidation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5 jsonschema==4.23.0 rfc3339-validator==0.1.4 cryptography==46.0.3
      - run: python -B -m pytest tests -q
      - run: python -B scripts/development_acceptance.py --out artifacts/development-acceptance
  studio-model-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: development/studio_d7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx --no-install tsc --noEmit
      - run: node --test tests/modelWitnessView.test.cjs
