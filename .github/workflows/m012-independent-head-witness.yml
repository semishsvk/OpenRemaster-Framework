name: M012 Independent Head Witness Synthetic Review
on:
  pull_request:
    branches: [m011/signed-remote-recovery-lab-20261014]
    paths:
      - 'src/openremaster/m012_independent_head_witness.py'
      - 'tests/test_m012_independent_head_witness.py'
      - 'docs/contracts/m012-independent-head-witness.md'
      - '.github/workflows/m012-independent-head-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m012-head-witness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5 jsonschema==4.23.0 rfc3339-validator==0.1.4 cryptography==46.0.4
      - name: Verify offline M012 only (no owner service or worker)
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_m012_independent_head_witness.py
